.owner-qr,
.member-passes {
  --owner-ink: #edf2ee;
  --owner-muted: #a4afa8;
  --owner-border: #a5b2aa30;
  --owner-orange: #e55330;
  color: var(--owner-ink);
  font-family: Onest, Arial, sans-serif;
}
.owner-pass *,
.owner-qr *,
.member-passes * {
  box-sizing: border-box;
}
.owner-pass {
  max-width: 1380px;
  margin: auto;
  padding: 38px clamp(20px, 4vw, 64px) 64px;
}
.owner-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--owner-border);
  font-size: 12px;
}
.owner-nav a {
  color: inherit;
  text-decoration: none;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: 12px;
}
.owner-test {
  color: var(--owner-muted);
  font-size: 10px;
  letter-spacing: 0.14em;
}
.owner-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr);
  align-items: center;
  gap: clamp(32px, 5vw, 88px);
}
.owner-copy {
  min-width: 0;
  padding: 54px 0;
}
.owner-kicker {
  font-size: 10px;
  letter-spacing: 0.18em;
  color: #e9896e;
  text-transform: uppercase;
}
.owner-copy h1 {
  font:
    400 clamp(34px, 3.9vw, 60px)/1.22 Unbounded,
    sans-serif;
  letter-spacing: -0.05em;
  margin: 24px 0;
}
.owner-copy h1 span {
  display: block;
  color: #e9896e;
}
.owner-lead {
  max-width: 420px;
  font-size: 15px;
  line-height: 1.85;
  color: var(--owner-muted);
}
.owner-details {
  margin: 30px 0;
  border-top: 1px solid var(--owner-border);
}
.owner-details > div {
  display: grid;
  grid-template-columns: 95px minmax(0, 1fr);
  gap: 20px;
  padding: 16px 0;
  border-bottom: 1px solid var(--owner-border);
}
.owner-details dt {
  font-size: 9px;
  color: var(--owner-muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.owner-details dd {
  margin: 0;
  font-size: 12px;
  line-height: 1.75;
  overflow-wrap: anywhere;
}
.owner-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  margin: 24px 0 16px;
}
.owner-button {
  min-height: 48px;
  padding: 14px 20px;
  color: #f7f5ef;
  background: #c43e22;
  border: 1px solid #e55330;
  border-radius: 3px;
  font:
    500 12px Onest,
    sans-serif;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  text-decoration: none;
  cursor: pointer;
}
.owner-button-secondary {
  background: transparent;
  border-color: #6c7770;
  color: var(--owner-ink);
}
.owner-button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
.owner-text-button {
  background: transparent;
  color: var(--owner-muted);
  border: 0;
  padding: 12px;
  text-decoration: underline;
  text-underline-offset: 5px;
  font:
    12px Onest,
    sans-serif;
  cursor: pointer;
  min-height: 44px;
}
:is(.owner-pass, .owner-qr, .member-passes) :is(a, button, input):focus-visible {
  outline: 2px solid #b0e7d0;
  outline-offset: 5px;
}
.owner-small {
  font-size: 11px;
  line-height: 1.75;
  color: var(--owner-muted);
}
.owner-message {
  font-size: 13px;
  line-height: 1.7;
  border-left: 2px solid #e9896e;
  padding: 12px 16px;
  background: #ffffff05;
  overflow-wrap: anywhere;
}
.owner-exhibit {
  min-width: 0;
  margin: 28px 0 0;
  position: relative;
  text-align: center;
}
.owner-exhibit-label {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  font-size: 8px;
  letter-spacing: 0.14em;
  color: var(--owner-muted);
  padding: 18px 0;
  border-top: 1px solid var(--owner-border);
}
.owner-stage {

.owner-strap {

}
.owner-card-eyelet {

    0 1px 0 #fff;
}
.owner-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.owner-card-head .vne-brand-mark {
  width: 77px;
  height: 27px;
  display: inline-block;
  background: currentColor;
  mask-size: contain;
  mask-position: center;
  mask-repeat: no-repeat;
  -webkit-mask-size: contain;
  -webkit-mask-position: center;

.owner-card-head > span:last-child {

}
.owner-card-event {

.owner-card-caption {

}
.owner-card-art {

  left: 20px;

}
.owner-card-art i {

  width: 115px;

  border: 1px solid #734026;

}
.owner-card-art i:nth-child(2) {
  left: 46px;
}
.owner-card-art i:nth-child(3) {
  left: 58px;
}
.owner-card-art i:nth-child(4) {
  left: 70px;
}
.owner-card-art i:nth-child(5) {
  left: 82px;
}
.owner-card-art i:nth-child(6) {
  left: 94px;
}
.owner-card-art i:nth-child(7) {
  left: 106px;
}
.owner-card-art i:nth-child(8) {
  left: 118px;
}
.owner-card-art i:nth-child(9) {
  left: 130px;
}
.owner-card-edition {
  position: absolute;
  left: 22px;
  bottom: 72px;
  display: block;
  font:
    500 16px/1.55 Unbounded,
    sans-serif;
  letter-spacing: -0.035em;
}
.owner-card-edition em {
  color: #aa3b21;
  font-style: normal;
}
.owner-card-foot {
  position: absolute;
  bottom: 23px;
  left: 22px;
  right: 22px;
  display: flex;
  justify-content: space-between;
  padding-top: 14px;
  border-top: 1px solid #25282040;
  font-size: 7px;
  letter-spacing: 0.07em;
}
.owner-card-sheen {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(112deg, transparent 25%, #fff8 49%, transparent 64%);
  opacity: 0.12;
}
.owner-plinth {
  position: absolute;
  width: 210px;
  height: 12px;
  border-radius: 50%;
  background: #0007;
  filter: blur(10px);
  bottom: 12px;
  left: calc(50% - 105px);
  z-index: -1;
}
.owner-reveal-halo {
  position: absolute;
  inset: 20% -5% 0;
  pointer-events: none;
  z-index: -2;
  background: radial-gradient(ellipse at center, #d77c4830, transparent 65%);
}
.owner-light-line {
  position: absolute;
  top: 35px;
  bottom: 0;
  left: 50%;
  width: 1px;
  background: linear-gradient(transparent, #e9896e80, transparent);
  z-index: -1;
  opacity: 0;
}
.owner-exhibit figcaption {

  font-size: 11px;
  line-height: 1.7;
}
.owner-exhibit[data-reveal="revealing"] .owner-art-card {
  animation: owner-reveal-card 1.8s cubic-bezier(0.18, 0.75, 0.25, 1) both;
}
.owner-exhibit[data-reveal="revealing"] .owner-reveal-halo {
  animation: owner-reveal-light 1.8s ease-out both;
}
.owner-exhibit[data-reveal="revealing"] .owner-light-line {
  animation: owner-reveal-line 1.8s ease-out both;
}
.owner-exhibit[data-reveal="revealing"] .owner-card-sheen {
  animation: owner-sheen 1.8s ease-out both;
}
@keyframes owner-reveal-card {
  from {
    opacity: 0;
    transform: translateY(34px) scale(0.92) rotateY(-14deg);
  }
  40% {
    opacity: 1;
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes owner-reveal-light {
  from {
    opacity: 0;
    transform: scale(0.65);
  }
  45% {
    opacity: 1;
    transform: scale(1.16);
  }
  to {
    opacity: 0.7;
    transform: scale(1);
  }
}
@keyframes owner-reveal-line {
  from {
    opacity: 0;
    transform: scaleY(0.4);
  }
  35% {
    opacity: 1;
  }
  to {
    opacity: 0;
    transform: scaleY(1);
  }
}
@keyframes owner-sheen {
  from {
    transform: translateX(-120%);
    opacity: 0.5;
  }
  to {
    transform: translateX(120%);
    opacity: 0;
  }
}
.owner-qr {
  max-width: 720px;
  margin: auto;
  padding: 32px 20px 72px;
}
.owner-qr h1 {
  font:
    400 clamp(26px, 5vw, 40px)/1.35 Unbounded,
    sans-serif;
  letter-spacing: -0.04em;
  margin: 30px 0 18px;
}
.owner-qr-frame {
  width: min(100%, 400px);

  padding: 12px;
  background: #fff;
  color: #111;

}
.owner-qr-frame svg {

  transform: none;
  animation: none;
}
.owner-qr-caption {
  font-size: 11px;
  line-height: 1.65;

  padding: 8px 4px 2px;
}
.owner-rotate {
  border: 1px solid #8c5b42;

  padding: 20px;
  margin: 24px 0;
}
.owner-rotate label {
  display: grid;
  gap: 10px;
  font-size: 13px;
}
.owner-rotate input[type="text"] {
  width: 100%;
  min-height: 46px;
  padding: 12px;
  color: inherit;
  background: #111815;
  border: 1px solid #6c7770;
  border-radius: 3px;
  font: inherit;
}
.owner-rotate .owner-check {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin: 20px 0;
  line-height: 1.6;
}
.owner-check input {
  margin-top: 5px;
}
.member-passes {
  margin-top: 40px;
  padding-top: 30px;
  border-top: 1px solid var(--owner-border);
}
.member-passes h2 {
  font:
    400 22px/1.5 Unbounded,
    sans-serif;
}
.member-pass-list {
  list-style: none;
  padding: 0;
  display: grid;
  gap: 16px;
  margin: 20px 0;
}
.member-pass-list li {
  border: 1px solid var(--owner-border);

}
.member-pass-list h3 {
  font-size: 16px;
  margin: 0 0 8px;

}
@media (max-width: 800px) {

    grid-template-columns: 1fr;

  }

    padding: 36px 0 0;

    margin-top: 0;

  .owner-copy h1 {

}

    height: 540px;
  }

    zoom: 0.87;
  }

  }
  .owner-nav {
    gap: 6px;
  }
  .owner-test {
    font-size: 9px;
  }
}
@media (prefers-reduced-motion: reduce) {

  }

    transform: none !important;

}

}
